<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sondage : le Tour de France, un patrimoine français</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fffbea;--card:#fff;--ink:#1d2433;--mut:#667085;--yel:#f7c600;--blue:#1e3a8a;--red:#c8102e;--line:#e6dfc3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#1a2240;--ink:#f2f4fa;--mut:#a3adc7;--line:#2c3763;--blue:#9db4ff}}
:root[data-theme="dark"]{--bg:#10162a;--card:#1a2240;--ink:#f2f4fa;--mut:#a3adc7;--line:#2c3763;--blue:#9db4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
header{background:var(--yel);color:#1d2433;padding:22px 18px 18px;text-align:center;border-bottom:4px solid var(--blue)}
header h1{margin:0;font-size:1.35rem;line-height:1.25}
header p{margin:6px 0 0;font:.9rem system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--yel);transition:width .3s}
.cnt{font:.85rem system-ui,sans-serif;color:var(--mut);margin-bottom:14px}
h2{font-size:1.2rem;margin:0 0 14px;line-height:1.3}
.hint{font:.85rem system-ui,sans-serif;color:var(--mut);margin:-8px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:0 0 9px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--blue);background:rgba(30,58,138,.1);font-weight:bold}
.sc{display:flex;gap:8px}.sc .opt{text-align:center;margin:0;padding:12px 0}
.lab{display:flex;justify-content:space-between;font:.8rem system-ui,sans-serif;color:var(--mut);margin-top:6px}
textarea{width:100%;min-height:110px;padding:12px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border:0;border-radius:10px;font:bold 1rem system-ui,sans-serif;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line);flex:.5}
.btn:disabled{opacity:.4;cursor:default}
.ok{color:#15803d;font:bold 1rem system-ui,sans-serif}
.warn{background:rgba(247,198,0,.2);padding:10px 12px;border-radius:8px;font:.9rem system-ui,sans-serif}
.res{margin:0 0 18px}.res b{display:block;margin-bottom:6px;font-size:.98rem}
.rb{display:flex;align-items:center;gap:8px;font:.85rem system-ui,sans-serif;margin:3px 0}
.rb span.n{width:46%}.rb .t{flex:1;background:var(--line);border-radius:5px;height:14px}.rb .t i{display:block;height:100%;background:var(--blue);border-radius:5px}
.txt{font-size:.9rem;border-left:3px solid var(--yel);padding:2px 10px;margin:5px 0}
footer{text-align:center;font:.8rem system-ui,sans-serif;color:var(--mut);padding:16px}
a.lnk{color:var(--blue);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header><h1>🚴 Le Tour de France, un patrimoine français</h1><p>Sondage anonyme · 15 questions · 3 minutes</p></header>
<main><div id="app"></div></main>
<footer>Sondage réalisé pour un grand oral d'HGGSP · <a class="lnk" id="adm" style="display:none">Espace organisateur</a></footer>
<script>
const Q=[
{q:"Quelle est votre tranche d'âge ?",t:"s",o:["Moins de 18 ans","18–30 ans","31–50 ans","51–65 ans","Plus de 65 ans"]},
{q:"À quelle fréquence suivez-vous le Tour de France ?",t:"s",o:["Jamais","Rarement","Quelques étapes chaque été","Tous les jours en juillet"]},
{q:"Comment le suivez-vous ?",t:"m",o:["À la télévision","Au bord de la route","À la radio","Sur les réseaux / internet","Dans la presse","Je ne le suis pas"]},
{q:"En quelle année a eu lieu la première édition du Tour de France ?",t:"s",o:["1903","1913","1923","1936"],a:0},
{q:"Pourquoi le maillot du leader est-il jaune ?",t:"s",o:["Pour rappeler le soleil de juillet","Couleur du papier du journal L'Auto, créateur du Tour","Couleur du premier sponsor","Hasard, choix des coureurs"],a:1},
{q:"Pour vous, le Tour de France fait-il partie du patrimoine français ?",t:"c",l:["Pas du tout","Tout à fait"]},
{q:"Qu'évoque le Tour pour vous ? (plusieurs réponses)",t:"m",o:["Les paysages","Le sport et l'effort","La convivialité","L'histoire et la tradition","La caravane publicitaire","Le dopage","Rien de particulier"]},
{q:"Avez-vous déjà vu le Tour passer en direct ?",t:"s",o:["Oui, plusieurs fois","Oui, une fois","Non, mais j'aimerais","Non, ça ne m'intéresse pas"]},
{q:"La caravane publicitaire fait-elle partie du charme du Tour ?",t:"c",l:["Pas du tout","Tout à fait"]},
{q:"Le Tour met-il bien en valeur les territoires français ?",t:"c",l:["Pas du tout","Tout à fait"]},
{q:"Quels lieux mythiques du Tour connaissez-vous ? (plusieurs réponses)",t:"m",o:["Le col du Tourmalet","L'Alpe d'Huez","Le Mont Ventoux","Le col du Galibier","Les Champs-Élysées","Aucun"]},
{q:"Qui est le dernier Français vainqueur du Tour de France ?",t:"s",o:["Bernard Hinault","Laurent Fignon","Richard Virenque","Thibaut Pinot","Je ne sais pas"],a:0},
{q:"Le Tour de France devrait-il être reconnu comme patrimoine culturel immatériel (UNESCO) ?",t:"s",o:["Oui, sans hésiter","Plutôt oui","Plutôt non","Non","Sans avis"]},
{q:"Quel est selon vous le principal danger pour l'avenir du Tour ?",t:"s",o:["Le dopage","Le coût et la commercialisation","L'impact écologique","Le désintérêt des jeunes","La sécurité sur les routes","Aucun danger"]},
{q:"Un mot ou une phrase pour décrire le Tour de France :",t:"x"}
];
const A=Q.map(q=>q.t=="m"?[]:null);let i=0,db=null,user=null,done=false,saved=null;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=k=>{const v=A[k];return Q[k].t=="m"?v.length>0:Q[k].t=="x"?true:v!==null&&v!==""};
function render(){
 if(done)return fin();
 const q=Q[i],v=A[i];let h=`<div class="card"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="cnt">Question ${i+1} sur ${Q.length}</div><h2>${esc(q.q)}</h2>`;
 if(q.t=="s")h+=q.o.map((o,k)=>`<button class="opt${v===k?" sel":""}" data-k="${k}">${esc(o)}</button>`).join("");
 if(q.t=="m")h+=`<p class="hint">Plusieurs choix possibles</p>`+q.o.map((o,k)=>`<button class="opt${v.includes(k)?" sel":""}" data-k="${k}">${esc(o)}</button>`).join("");
 if(q.t=="c")h+=`<div class="sc">${[1,2,3,4,5].map(n=>`<button class="opt${v===n?" sel":""}" data-k="${n}">${n}</button>`).join("")}</div><div class="lab"><span>${q.l[0]}</span><span>${q.l[1]}</span></div>`;
 if(q.t=="x")h+=`<textarea id="tx" maxlength="300" placeholder="Votre réponse (facultatif)">${esc(v||"")}</textarea>`;
 h+=`<div class="nav">${i?'<button class="btn sec" id="pv">Retour</button>':""}<button class="btn" id="nx" ${ok(i)?"":"disabled"}>${i==Q.length-1?"Envoyer":"Suivant"}</button></div></div>`;
 app.innerHTML=h;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
  if(q.t=="m"){const j=A[i].indexOf(k);j<0?A[i].push(k):A[i].splice(j,1)}else A[i]=k;render()});
 const tx=$("#tx");if(tx)tx.oninput=()=>A[i]=tx.value;
 const pv=$("#pv");if(pv)pv.onclick=()=>{i--;render()};
 $("#nx").onclick=()=>{if(i<Q.length-1){i++;render();scrollTo(0,0)}else submit()};
}
function payload(){return{t:Date.now(),a:A.map((v,k)=>Q[k].t=="x"?(v||""):v)}}
function label(v,k){const q=Q[k];if(q.t=="m")return v.map(x=>q.o[x]).join(" | ");if(q.t=="s")return q.o[v]??"";return v===null?"":v}
async function submit(){
 const p=payload();done=true;saved="wait";render();
 try{if(!db)throw 0;await db.collection("responses").doc("r"+p.t+Math.random().toString(36).slice(2,7)).set(p);saved="ok"}catch(e){saved="no"}
 render();
}
function fin(){
 const quiz=Q.map((q,k)=>q.a!==undefined?(A[k]===q.a?1:0):null).filter(x=>x!==null),sc=quiz.reduce((a,b)=>a+b,0);
 const txt=Q.map((q,k)=>`${k+1}. ${q.q}\n→ ${label(A[k],k)}`).join("\n\n");
 let h=`<div class="card"><h2>Merci pour votre participation ! 🎉</h2><p>Mini-quiz : <b>${sc}/${quiz.length}</b> bonnes réponses (questions 4, 5 et 12).</p>`;
 if(saved=="wait")h+="<p>Envoi en cours…</p>";
 else if(saved=="ok")h+='<p class="ok">✓ Vos réponses ont bien été enregistrées.</p>';
 else h+=`<p class="warn">Vos réponses n'ont pas pu être enregistrées automatiquement. Copiez-les et envoyez-les à l'organisateur du sondage.</p><div class="nav"><button class="btn" id="cp">Copier mes réponses</button></div>`;
 app.innerHTML=h+"</div>";
 const c=$("#cp");if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(txt);c.textContent="Copié ✓"}catch(e){c.textContent="Copie impossible"}};
}
function csv(rows){const e=s=>'"'+String(s).replace(/"/g,'""')+'"';
 return "\ufeff"+[["Date",...Q.map((q,k)=>"Q"+(k+1))].map(e).join(";"),...rows.map(r=>[new Date(r.t).toLocaleString("fr-FR"),...Q.map((q,k)=>label(r.a[k],k))].map(e).join(";"))].join("\n")}
function admin(){
 app.innerHTML='<div class="card"><h2>Espace organisateur</h2><p>Chargement…</p></div>';
 if(!db){app.innerHTML='<div class="card"><h2>Espace organisateur</h2><p class="warn">Base de données indisponible.</p></div>';return}
 db.collection("responses").onSnapshot(s=>{
  const rows=s.docs.map(d=>d.data()).filter(r=>r&&Array.isArray(r.a)).sort((a,b)=>a.t-b.t);
  let h=`<div class="card"><h2>Résultats : ${rows.length} réponse${rows.length>1?"s":""}</h2><div class="nav" style="margin:0 0 18px"><button class="btn" id="dl" ${rows.length?"":"disabled"}>Télécharger en CSV (Excel)</button><button class="btn sec" id="bk">Sondage</button></div>`;
  Q.forEach((q,k)=>{h+=`<div class="res"><b>${k+1}. ${esc(q.q)}</b>`;
   if(q.t=="x")h+=rows.filter(r=>r.a[k]).map(r=>`<div class="txt">${esc(r.a[k])}</div>`).join("")||"<i>Aucune réponse</i>";
   else{const labs=q.t=="c"?[1,2,3,4,5].map(String):q.o,cnt=labs.map(()=>0);
    rows.forEach(r=>{const v=r.a[k];(Array.isArray(v)?v:[v]).forEach(x=>{const j=q.t=="c"?x-1:x;if(cnt[j]!==undefined)cnt[j]++})});
    const mx=Math.max(1,...cnt);
    h+=labs.map((l,j)=>`<div class="rb"><span class="n">${esc(l)}${q.a===j?" ✓":""}</span><span class="t"><i style="width:${cnt[j]/mx*100}%"></i></span><span>${cnt[j]}</span></div>`).join("")}
   h+="</div>"});
  app.innerHTML=h+"</div>";
  $("#bk").onclick=()=>{done=false;i=0;render()};
  const d=$("#dl");if(d)d.onclick=async()=>{try{const dn=await claude.use("downloads");await dn.save({filename:"reponses-sondage-tour-de-france.csv",data:csv(rows)})}catch(e){}};
 },()=>{});
}
render();
(async()=>{try{
 if(!window.claude)return;
 db=await claude.use("db");user=await claude.use("user");
 if(user&&user.isOwner()){const a=$("#adm");a.style.display="inline";a.onclick=admin}
}catch(e){}})();
</script>
</body>
</html>
